# yaml-language-server: $schema=https://instadeep.aichor.ai/schema/latest/manifest.schema.json
#
# xgboost - count: -1
# Expected: rejected at validation: count minimum is 0 (varys: "count: must be >= 0")
#
# Trigger:
#   git commit --allow-empty -m "aichor(count-scenarios/xgboost/count-minus-1.yaml): xgboost, count: -1"

kind: AIchorManifest
apiVersion: 0.2.2

builder:
  image: lite
  context: lite # lite folder
  dockerfile: ./Dockerfile

spec:
  operator: xgboost
  image: lite
  command: "python3 -u main.py 5"

  # No master block: 0.2.3 XGBoostTypes exposes `worker` only --
  # rank 0 is the coordinator (MASTER_ADDR points at the JobSet coordinator).
  #
  # No debug block: debug.jupyter is kuberay-only, the Debug schema these
  # operators share accepts `vscode` only.

  tensorboard:
    enabled: false

  types:
    worker:
      count: -1 # <- field under test
      resources:
        cpus: 1
        ramRatio: 2
        shmSizeGB: 0
