# yaml-language-server: $schema=https://instadeep.aichor.ai/schema/latest/manifest.schema.json
#
# xgboost - no count present
# Expected: accepted, count defaults to 1 -> master + 1 worker pod(s)
#
# Trigger:
#   git commit --allow-empty -m "aichor(count-scenarios/xgboost/count-absent.yaml): xgboost, no count present"

kind: AIchorManifest
apiVersion: 0.2.2

builder:
  image: lite
  context: lite # lite folder
  dockerfile: ./Dockerfile

spec:
  operator: xgboost
  image: lite
  command: "python3 -u main.py 5"

  # No debug block: debug.jupyter is kuberay-only, the Debug schema these
  # operators share accepts `vscode` only.

  tensorboard:
    enabled: false

  types:
    Master:
      count: 1
      resources:
        cpus: 1
        ramRatio: 2
        shmSizeGB: 0
    Worker:
      resources:
        cpus: 1
        ramRatio: 2
        shmSizeGB: 0
