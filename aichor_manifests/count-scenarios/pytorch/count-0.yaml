# yaml-language-server: $schema=https://instadeep.aichor.ai/schema/latest/manifest.schema.json
#
# pytorch - count: 0
# Expected: accepted, 0 worker pod(s)
#
# Trigger:
#   git commit --allow-empty -m "aichor(count-scenarios/pytorch/count-0.yaml): pytorch, count: 0"

kind: AIchorManifest
apiVersion: 0.2.2

builder:
  image: lite
  context: lite # lite folder
  dockerfile: ./Dockerfile

spec:
  operator: pytorch
  image: lite
  command: "python3 -u main.py 5"

  # No master block: 0.2.3 PyTorchTypes exposes `worker` only --
  # rank 0 is the coordinator (MASTER_ADDR points at the JobSet coordinator).
  #
  # No debug block: debug.jupyter is kuberay-only, the Debug schema these
  # operators share accepts `vscode` only.

  tensorboard:
    enabled: false

  types:
    worker:
      count: 0 # <- field under test
      resources:
        cpus: 1
        ramRatio: 2
        shmSizeGB: 0
