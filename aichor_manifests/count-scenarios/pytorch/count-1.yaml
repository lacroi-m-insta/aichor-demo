# yaml-language-server: $schema=https://instadeep.aichor.ai/schema/latest/manifest.schema.json
#
# pytorch - count: 1
# Expected: accepted, master + 1 worker pod(s)
#
# Trigger:
#   git commit --allow-empty -m "aichor(count-scenarios/pytorch/count-1.yaml): pytorch, count: 1"

kind: AIchorManifest
apiVersion: 0.2.2

builder:
  image: lite
  context: lite # lite folder
  dockerfile: ./Dockerfile

spec:
  operator: pytorch
  image: lite
  command: "python3 -u main.py 5"

  # No debug block: debug.jupyter is kuberay-only, the Debug schema these
  # operators share accepts `vscode` only.

  tensorboard:
    enabled: false

  types:
    Master:
      count: 1
      resources:
        cpus: 1
        ramRatio: 2
        shmSizeGB: 0
    Worker:
      count: 1 # <- field under test
      resources:
        cpus: 1
        ramRatio: 2
        shmSizeGB: 0
