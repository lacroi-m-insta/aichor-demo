# yaml-language-server: $schema=https://instadeep.aichor.ai/schema/latest/manifest.schema.json
#
# kuberay - no count present
# Expected: accepted, count defaults to 0 -> head + 0 worker pod(s)
#
# Trigger:
#   git commit --allow-empty -m "aichor(count-scenarios/kuberay/count-absent.yaml): kuberay, no count present"

kind: AIchorManifest
apiVersion: 0.2.2

builder:
  image: ray-lite
  context: ray-lite # ray-lite folder
  dockerfile: ./Dockerfile

spec:
  operator: kuberay
  image: ray-lite
  rayVersion: "2.36.1" # must match the base image in ray-lite/Dockerfile
  # 60s worker wait so the 0-worker scenarios do not sit at the default 120s.
  command: "RAY_NODE_WAIT_TIMEOUT=60 python3 -u main.py 5"

  debug:
    jupyter: false

  tensorboard:
    enabled: false

  types:
    Head:
      resources:
        cpus: 1
        ramRatio: 2
    Workers:
      - name: cpu-workers
        resources:
          cpus: 1
          ramRatio: 2
          shmSizeGB: 0
